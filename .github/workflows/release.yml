name: Release

# 打 v* 标签即触发：跑自测 → 打包 EXE → 压缩 → 创建 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号（例如 v1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 录制内核自测
        run: python tests/selftest_core.py

      - name: 时长回归自测
        run: python tests/selftest_duration.py

      - name: 打包 EXE
        run: powershell -ExecutionPolicy Bypass -File build_exe.ps1 -SkipSmokeTest

      - name: 打包产物信息
        run: |
          $exe = "dist\截图工具\截图工具.exe"
          $size = [math]::Round((Get-ChildItem "dist\截图工具" -Recurse -File |
                   Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "EXE: $((Get-Item $exe).Length / 1MB) MB，整包 $size MB"

      - name: 压缩为免安装 zip
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event.inputs.tag }}") { $tag = "${{ github.event.inputs.tag }}" }
          Compress-Archive -Path "dist\截图工具\*" `
            -DestinationPath "WinSnipRec-$tag-win64.zip" -CompressionLevel Optimal
          Write-Host "zip: $((Get-Item "WinSnipRec-$tag-win64.zip").Length / 1MB) MB"

      - name: 安装 Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup 安装失败"
          }

      - name: 编译安装包
        run: powershell -ExecutionPolicy Bypass -File build_installer.ps1 -SkipAppBuild

      - name: 生成 SHA256
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event.inputs.tag }}") { $tag = "${{ github.event.inputs.tag }}" }
          $lines = @()
          foreach ($f in @("WinSnipRec-$tag-win64.zip",
                           "WinSnipRec-Setup-$tag.exe")) {
            if (Test-Path $f) {
              $lines += "$((Get-FileHash $f -Algorithm SHA256).Hash)  $f"
              Write-Host "$f  $([math]::Round((Get-Item $f).Length / 1MB, 1)) MB"
            }
          }
          $lines | Out-File -Encoding ASCII "SHA256SUMS.txt"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: WinSnipRec ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            **安装版（推荐）**：下载 `WinSnipRec-Setup-*.exe` 双击即可。按用户安装到
            `%LOCALAPPDATA%\Programs\WinSnipRec`，**不需要管理员权限**，自带卸载程序，
            安装时会询问是否创建桌面快捷方式和开机自启。

            **免安装版**：下载 `WinSnipRec-*-win64.zip`，解压后双击 `截图工具.exe`。
            两个版本都**不需要安装 Python**。

            系统要求：Windows 10 1809 及以上（Windows 11 同样可用），64 位。

            校验下载完整性：

            ```
            certutil -hashfile WinSnipRec-*-win64.zip SHA256
            ```
          files: |
            WinSnipRec-*-win64.zip
            WinSnipRec-Setup-*.exe
            SHA256SUMS.txt
