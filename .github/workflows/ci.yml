name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 显示环境
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q app.py winsnip tests tools

      - name: 开机自启自测（22 项）
        run: python tests/selftest_startup.py

      - name: 全局快捷键自测（7 项）
        run: python tests/selftest_hotkeys.py

      - name: 界面风格自测（44 项）
        run: python tests/selftest_style.py

      - name: 设备枚举自测（15 项，确保不阻塞界面）
        run: python tests/selftest_devices.py

      - name: 背景材质自测（13 项，探测与回退）
        run: python tests/selftest_backdrop.py

      # 时长回归：人为把抓屏拖慢，验证"分段不会被静默丢弃"。
      # 这条专门覆盖慢机器场景，是硬性门槛。
      - name: 时长回归自测（8 项）
        run: python tests/selftest_duration.py

      # 录制内核自测会真的抓屏编码，在共享/虚拟化的 runner 上仍可能因抓屏
      # 跟不上而抖动（音频设备也可能不存在）。作为信号保留，不阻塞构建。
      - name: 录制内核自测（51 项，不阻塞构建）
        continue-on-error: true
        run: python tests/selftest_core.py

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.python-version }}
          path: |
            **/*.log
            _selftest*/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
